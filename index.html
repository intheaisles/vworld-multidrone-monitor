<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VWorld Multi-Drone Monitor</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; }
    #map { width: 100%; height: calc(100% - 57px); }
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0">VWorld Multi-Drone Monitor</h1>
  </header>

  <!-- 지도 영역 -->
  <div id="map"></div>

  <!-- VWorld 3D 지도 SDK -->
  <script src="https://map.vworld.kr/js/apis.do?type=3d&apiKey=5FFE87C6-6704-3686-BC9E-C315D75F178E"></script>
  <script>
    // 브이월드 3D 지도 초기화
    vw.ol3.MapOptions = {
      basemapType: vw.ol3.BasemapType.GRAPHIC, // 기본 배경지도 (그래픽형)
      controlDensity: vw.ol3.DensityType.FULL,
      interactionDensity: vw.ol3.DensityType.FULL,
      tileMode: vw.ol3.TileMode.RASTER,
      initPosition: vw.ol3.CameraPosition,
      mapAutoControl: false
    };

    // 지도 생성
    var map = new vw.ol3.Map("map", vw.ol3.MapOptions);
    map.setCenterAndZoom(new vw.Coord(127.5, 36.3), 7); // 한반도 중심
  </script>
</body>
</html>
